include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Freezed/json_serializable place @JsonKey on constructor parameters by design;
    # ignoring this diagnostic is the approach documented by the freezed package.
    invalid_annotation_target: ignore

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_print: true
